name: Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        # Tag builds are the real thing; everything else gets a throwaway build number so the
        # artifact is still traceable back to a run.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="0.0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build
        run: |
          dotnet build plugin/Jellyfin.Plugin.BrowseModes/Jellyfin.Plugin.BrowseModes.csproj -c Release \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Check shipped assemblies
        # The plugin folder must contain exactly its own DLL plus TMDbLib and Newtonsoft.Json.
        # A Jellyfin assembly appearing here means ExcludeAssets="runtime" was lost, which would
        # give the plugin's AssemblyLoadContext duplicate type identities at runtime.
        run: |
          cd plugin/Jellyfin.Plugin.BrowseModes/bin/Release/net10.0
          ls *.dll
          if ls | grep -qE '^(Jellyfin\.(Controller|Model|Data|Extensions)|MediaBrowser\.)'; then
            echo "::error::A Jellyfin assembly is being shipped with the plugin"
            exit 1
          fi
          test -f TMDbLib.dll || { echo "::error::TMDbLib.dll missing from output"; exit 1; }

      - name: Package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/BrowseModes
          cp plugin/Jellyfin.Plugin.BrowseModes/bin/Release/net10.0/*.dll dist/BrowseModes/
          sed "s/__VERSION__/$VERSION/; s/__TIMESTAMP__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" \
            plugin/meta.template.json > dist/BrowseModes/meta.json
          cd dist/BrowseModes && zip -r ../browse-modes_${VERSION}.zip . && cd ../..
          echo "checksum=$(md5sum dist/browse-modes_${VERSION}.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Report checksum
        # Printed so the manifest entry can be filled in without downloading the artifact.
        run: |
          echo "### Plugin ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "md5: \`${{ steps.package.outputs.checksum }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*.zip

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
