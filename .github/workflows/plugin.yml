name: Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build plugin/Jellyfin.Plugin.BrowseModes/Jellyfin.Plugin.BrowseModes.csproj -c Release

      - name: Check shipped assemblies
        # The plugin folder must contain exactly its own DLL plus TMDbLib and Newtonsoft.Json.
        # A Jellyfin assembly appearing here means ExcludeAssets="runtime" was lost, which would
        # give the plugin's AssemblyLoadContext duplicate type identities at runtime.
        run: |
          cd plugin/Jellyfin.Plugin.BrowseModes/bin/Release/net10.0
          ls *.dll
          if ls | grep -qE '^(Jellyfin\.(Controller|Model|Data|Extensions)|MediaBrowser\.)'; then
            echo "::error::A Jellyfin assembly is being shipped with the plugin"
            exit 1
          fi
          test -f TMDbLib.dll || { echo "::error::TMDbLib.dll missing from output"; exit 1; }

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist/BrowseModes
          cp plugin/Jellyfin.Plugin.BrowseModes/bin/Release/net10.0/*.dll dist/BrowseModes/
          sed "s/__VERSION__/$VERSION/; s/__TIMESTAMP__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" \
            plugin/meta.template.json > dist/BrowseModes/meta.json
          cd dist/BrowseModes && zip -r ../browse-modes_${VERSION}.zip . && cd ../..
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum dist/browse-modes_${VERSION}.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*.zip

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
